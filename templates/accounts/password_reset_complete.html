{% extends 'base.html' %}

{% block title %}Password changed | RojGari{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-10 sm:px-6">
  <div class="rounded-2xl bg-white p-6 text-center shadow-sm">
    <h1 class="text-xl font-extrabold">Password changed</h1>
    <p class="mt-2 text-sm text-slate-500">You can now log in with your new password.</p>
    <a href="{% url 'accounts:login' %}"
       class="mt-5 inline-block rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Login</a>
  </div>
</div>
{% endblock %}
