{% extends 'base.html' %}

{% block title %}Resend verification | RojGari{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-10 sm:px-6">
  <div class="rounded-2xl bg-white p-6 shadow-sm">
    <h1 class="text-xl font-extrabold">Verification link feri pathaune</h1>
    <p class="mt-1 text-sm text-slate-500">Register garda halyeko email halnus.</p>

    <form method="post" class="mt-6 space-y-5">
      {% csrf_token %}
      <input type="email" name="email" required placeholder="you@example.com"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
      <button type="submit"
        class="w-full rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">
        Send link
      </button>
    </form>
  </div>
</div>
{% endblock %}
