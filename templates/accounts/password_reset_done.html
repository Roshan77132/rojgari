{% extends 'base.html' %}

{% block title %}Check your email | RojGari{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-10 sm:px-6">
  <div class="rounded-2xl bg-white p-6 text-center shadow-sm">
    <h1 class="text-xl font-extrabold">Check your email</h1>
    <p class="mt-2 text-sm text-slate-500">
      If an account exists for this email, we sent a password reset link. Check your spam folder if it does not arrive.
    </p>
    <a href="{% url 'accounts:login' %}"
       class="mt-5 inline-block text-sm font-semibold text-indigo-600 hover:underline">Back to login</a>
  </div>
</div>
{% endblock %}
