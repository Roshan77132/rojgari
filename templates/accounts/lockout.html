{% extends 'base.html' %}

{% block title %}Too many attempts | RojGari{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-10 sm:px-6">
  <div class="rounded-2xl bg-white p-6 text-center shadow-sm">
    <h1 class="text-xl font-extrabold">Too many failed attempts</h1>
    <p class="mt-2 text-sm text-slate-500">
      For your security, login is blocked for 15 minutes. Please try again later,
      or reset your password if you forgot it.
    </p>
    <a href="{% url 'accounts:password_reset' %}"
       class="mt-5 inline-block text-sm font-semibold text-indigo-600 hover:underline">Forgot password?</a>
  </div>
</div>
{% endblock %}
