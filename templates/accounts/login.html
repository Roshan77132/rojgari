{% extends 'base.html' %}

{% block title %}Login | RojGari{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-10 sm:px-6 lg:py-14">
  <div class="rounded-2xl border border-[#dbe5f5] bg-white p-6 shadow-sm shadow-blue-100/60 sm:p-8">
    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Welcome back</h1>
    <p class="mt-1 text-sm text-slate-500">Login to your RojGari account.</p>

    <form method="post" class="form-ui mt-6 space-y-5">
      {% csrf_token %}

      {% if error_message %}
        <div class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-600">
          {{ error_message }}
        </div>
      {% endif %}

      <div>
        <label for="username" class="mb-1 block text-sm font-semibold text-slate-700">Username</label>
        <input type="text" name="username" id="username" required autofocus>
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-semibold text-slate-700">Password</label>
        <input type="password" name="password" id="password" required>
      </div>

      <button type="submit"
        class="w-full rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700">
        Login
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-slate-500">
      Don't have an account?
      <a href="{% url 'accounts:register' %}" class="font-semibold text-blue-600 hover:underline">Register</a>
    </p>
  </div>
</div>
{% endblock %}
