<div class="flex flex-wrap items-center gap-2">
  {% if c.registration_document %}
    <a href="{% url 'core:company_document' c.pk %}" target="_blank"
       class="rounded-lg border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50">Document</a>
  {% endif %}
  {% if not c.is_verified %}
    <form method="post" action="{% url 'adminpanel:company_verify' c.pk %}" class="m-0">
      {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button class="rounded-lg bg-green-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-green-700">Approve</button>
    </form>
  {% endif %}
  <form method="post" action="{% url 'adminpanel:company_reject' c.pk %}" class="m-0 flex gap-1"
        onsubmit="return confirm('Reject garne?')">
    {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
    <input type="text" name="reason" placeholder="Karan (optional)"
           class="w-32 rounded-lg border border-slate-200 px-2 py-1 text-xs focus:border-indigo-500 focus:outline-none">
    <button class="rounded-lg bg-red-50 px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-100">{% if c.is_verified %}Revoke{% else %}Reject{% endif %}</button>
  </form>
</div>
